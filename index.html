<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Закрытая страница</title>
<meta name="description" content="Страница доступна по паролю.">
<meta property="og:type" content="website">
<meta property="og:title" content="Закрытая страница">
<meta property="og:description" content="Страница доступна по паролю.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Закрытая страница">
<meta name="twitter:description" content="Страница доступна по паролю.">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f5efe3,#e7dfcf);color:#29251f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
main{width:min(100%,520px);background:white;border-radius:24px;padding:26px;box-shadow:0 14px 44px #0002;text-align:center}
h1{font-size:26px;margin:0 0 18px}input,button{width:100%;font:inherit;padding:14px;border-radius:12px;margin-top:10px}input{border:1px solid #ccc}button{border:0;background:#26231f;color:white;font-weight:700}
#result{display:none}#result img{width:100%;height:auto;border-radius:14px;margin-top:18px}#result h2{font-size:27px;margin:20px 0 4px}#error{color:#b42318;min-height:1.4em}
.notice{margin:0 0 18px;padding:18px 16px;border:1px solid #e8c982;border-radius:18px;background:linear-gradient(145deg,#fff9e9,#fff2d2);text-align:left;box-shadow:0 5px 16px #9b76201a}
.notice-title{display:flex;align-items:center;gap:9px;justify-content:center;font-weight:800;font-size:18px;color:#805615;margin-bottom:10px}
.notice p{font-size:15px;line-height:1.55;margin:0;color:#51432b;text-align:center}
.notice strong{color:#75500f}.heart{font-size:19px}
.video-card{margin:20px 0;padding:10px;background:#171717;border-radius:20px;box-shadow:0 10px 28px #0002}
.video-card video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:12px}
.video-caption{margin:10px 4px 2px;color:#eee;font-size:13px;text-align:left}
.credit{margin:24px 0 2px;padding-top:16px;border-top:1px solid #eee;color:#8b8175;font-size:13px;letter-spacing:.3px}
.credit strong{color:#5b5147;font-weight:700}
</style>
</head>
<body><main>
<section id="login"><h1>Закрытая страница</h1><p>Введите пароль, чтобы продолжить</p>
<form id="form"><input id="password" type="password" placeholder="Пароль" autocomplete="off"><button type="submit">Открыть</button></form><p id="error"></p></section>
<section id="result"></section>
</main>
<script>
document.getElementById('form').addEventListener('submit',function(e){
e.preventDefault();
const p=document.getElementById('password').value.normalize('NFC').trim();
if(p==='Măhăluță'){
document.getElementById('login').style.display='none';
const result=document.getElementById('result');
result.innerHTML='<div class="notice"><div class="notice-title">⚠️ Важное предупреждение</div><p>Данный видеоролик создан исключительно в юмористических целях. Мы <strong>никого не хотим обидеть или задеть</strong>. Просим воспринимать всё с добром и улыбкой. И помните: <strong>Moara de piatră — лучшее село в мире!</strong> <span class="heart">❤️</span></p></div><div class="video-card"><video controls playsinline preload="metadata" poster=""><source src="https://drive.google.com/uc?export=download&id=1wW5vw66nJDBZeCy39SEQKhq5t9max4CQ" type="video/mp4">Ваш браузер не поддерживает воспроизведение видео.</video><div class="video-caption">Видео из Moara de piatră</div></div><p style="margin:0 0 18px"><a href="https://drive.google.com/file/d/1wW5vw66nJDBZeCy39SEQKhq5t9max4CQ/view" target="_blank" rel="noopener">Открыть видео отдельно</a></p><img src="cow.jpg" alt="Сельский пейзаж с коровой"><h2>Деревенская шлюха</h2><div class="credit">Разработчик <strong>sersunlovesyou</strong></div>';
result.style.display='block';
}else{document.getElementById('error').textContent='Неверный пароль'}
});
</script>
</body>
</html>
