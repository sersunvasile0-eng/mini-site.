<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Закрытая страница</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f0e9;color:#29251f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
main{width:min(100%,420px);background:white;border-radius:22px;padding:28px;box-shadow:0 12px 40px #0001;text-align:center}
h1{font-size:26px;margin:0 0 18px}input,button{width:100%;font:inherit;padding:14px;border-radius:12px;margin-top:10px}input{border:1px solid #ccc}button{border:0;background:#26231f;color:white;font-weight:700}
#result{display:none}#result img{width:100%;height:auto;border-radius:14px;margin-top:14px}#result h2{font-size:27px;margin:20px 0 4px}
#error{color:#b42318;min-height:1.4em}
</style>
</head>
<body><main>
<section id="login"><h1>Закрытая страница</h1><p>Введите пароль, чтобы продолжить</p>
<form id="form"><input id="password" type="password" placeholder="Пароль" autocomplete="off"><button type="submit">Открыть</button></form><p id="error"></p></section>
<section id="result"><h2>Деревенская шлюха</h2><p>Фото добавим следующим шагом.</p></section>
</main>
<script>
document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();const p=document.getElementById('password').value.normalize('NFC').trim();if(p==='Măhăluță'){document.getElementById('login').style.display='none';document.getElementById('result').style.display='block'}else{document.getElementById('error').textContent='Неверный пароль'}})
</script></body></html>
