<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Закрытая страница</title>
<meta name="description" content="Страница доступна по паролю.">
<meta property="og:type" content="website">
<meta property="og:title" content="Закрытая страница">
<meta property="og:description" content="Страница доступна по паролю.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Закрытая страница">
<meta name="twitter:description" content="Страница доступна по паролю.">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f5efe3,#e7dfcf);color:#29251f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
main{width:min(100%,520px);background:white;border-radius:24px;padding:26px;box-shadow:0 14px 44px #0002;text-align:center}
h1{font-size:26px;margin:0 0 18px}input,button{width:100%;font:inherit;padding:14px;border-radius:12px;margin-top:10px}input{border:1px solid #ccc}button{border:0;background:#26231f;color:white;font-weight:700}
#result{display:none}#result img{width:100%;height:auto;border-radius:14px;margin-top:18px}#result h2{font-size:27px;margin:20px 0 4px}#error{color:#b42318;min-height:1.4em}
.notice{margin:0 0 18px;padding:18px 16px;border:1px solid #e8c982;border-radius:18px;background:linear-gradient(145deg,#fff9e9,#fff2d2);text-align:left;box-shadow:0 5px 16px #9b76201a}
.notice-title{display:flex;align-items:center;gap:9px;justify-content:center;font-weight:800;font-size:18px;color:#805615;margin-bottom:10px}
.notice p{font-size:15px;line-height:1.55;margin:0;color:#51432b;text-align:center}
.notice strong{color:#75500f}.heart{font-size:19px}
.video-card{margin:22px 0;padding:24px 18px;border-radius:22px;background:linear-gradient(145deg,#29251f,#514536);color:#fff;box-shadow:0 12px 28px #29251f24;text-align:center}
.video-icon{width:62px;height:62px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#29251f;font-size:27px;padding-left:4px}
.video-card h3{margin:0 0 7px;font-size:20px}
.video-card p{margin:0 0 18px;color:#e8dfd2;font-size:14px;line-height:1.45}
.watch-link{display:block;width:100%;padding:14px 18px;border-radius:13px;background:#f5d58e;color:#392b12;text-decoration:none;font-weight:800;font-size:16px}
.video-frame{width:100%;aspect-ratio:9/16;max-height:620px;border:0;border-radius:18px;background:#111;display:block;object-fit:contain}
.video-card{margin:22px 0;padding:22px 16px;border-radius:24px;background:linear-gradient(145deg,#29251f,#514536);color:#fff;box-shadow:0 12px 28px #29251f24;text-align:center}
.video-card h3{margin:0 0 8px;font-size:21px}
.video-card p{margin:0 0 16px;color:#e8dfd2;font-size:14px;line-height:1.45}
.credit{margin:24px 0 2px;padding-top:16px;border-top:1px solid #eee;color:#8b8175;font-size:13px;letter-spacing:.3px}
.credit strong{color:#5b5147;font-weight:700}

.custom-player{position:relative;width:100%;aspect-ratio:9/16;max-height:620px;overflow:hidden;border-radius:18px;background:#080808}.custom-player video{width:100%;height:100%;display:block;object-fit:contain}.player-bar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(20,20,20,.88);backdrop-filter:blur(10px);color:#fff}.player-bar button{flex:0 0 38px;width:38px;height:38px;margin:0;padding:0;border:0;border-radius:50%;background:#f5d58e;color:#29251f;font-size:17px}.player-bar input{flex:1;min-width:0;margin:0;padding:0;accent-color:#f5d58e}.player-bar span{font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
</style>
</head>
<body><main>
<section id="login"><h1>Закрытая страница</h1><p>Введите пароль, чтобы продолжить</p>
<form id="form"><input id="password" type="password" placeholder="Пароль" autocomplete="off"><button type="submit">Открыть</button></form><p id="error"></p></section>
<section id="result"></section>
</main>
<script>
document.getElementById('form').addEventListener('submit',function(e){
e.preventDefault();
const p=document.getElementById('password').value.normalize('NFC').trim();
if(p==='Măhăluță'){
document.getElementById('login').style.display='none';
const result=document.getElementById('result');
result.innerHTML='<div class="notice"><div class="notice-title">⚠️ Важное предупреждение</div><p>Данный видеоролик создан исключительно в юмористических целях. Мы <strong>никого не хотим обидеть или задеть</strong>. Просим воспринимать всё с добром и улыбкой. И помните: <strong>Moara de piatră — лучшее село в мире!</strong> <span class="heart">❤️</span></p></div><div class="video-card"><h3>Видео из Moara de piatră</h3><p>Смотри видео прямо здесь, не переходя на другие сайты</p><div class="custom-player" id="customPlayer"><video id="siteVideo" playsinline preload="metadata"><source src="https://drive.google.com/file/d/1wW5vw66nJDBZeCy39SEQKhq5t9max4CQ/preview" type="video/mp4">Ваш браузер не поддерживает встроенное видео.</video><div class="player-bar"><button type="button" id="toggleVideo" aria-label="Воспроизвести">▶</button><input type="range" id="videoProgress" min="0" max="100" value="0" aria-label="Позиция видео"><span id="videoClock">0:00</span><button type="button" id="videoFullscreen" aria-label="На весь экран">⛶</button></div></div></div><img src="cow.jpg" alt="Сельский пейзаж с коровой"><h2>Деревенская шлюха</h2><div class="credit">Разработчик <strong>sersunlovesyou</strong></div>';
result.style.display='block';
const v=document.getElementById('siteVideo');const b=document.getElementById('toggleVideo');const r=document.getElementById('videoProgress');const t=document.getElementById('videoClock');const fmt=n=>Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0');b.addEventListener('click',()=>{if(v.paused){v.play().catch(()=>{});}else{v.pause();}});v.addEventListener('play',()=>b.textContent='Ⅱ');v.addEventListener('pause',()=>b.textContent='▶');v.addEventListener('timeupdate',()=>{if(v.duration){r.value=v.currentTime/v.duration*100;t.textContent=fmt(v.currentTime)+' / '+fmt(v.duration);}});r.addEventListener('input',()=>{if(v.duration){v.currentTime=Number(r.value)/100*v.duration;}});document.getElementById('videoFullscreen').addEventListener('click',()=>{const p=document.getElementById('customPlayer');if(p.requestFullscreen){p.requestFullscreen();}else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();}});
}else{document.getElementById('error').textContent='Неверный пароль'}
});
</script>
</body>
</html>
