name: Add website video
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-video.yml'
permissions:
  contents: write
jobs:
  add-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gdown
      - name: Download shared video
        run: |
          gdown --fuzzy 'https://drive.google.com/file/d/1wW5vw66nJDBZeCy39SEQKhq5t9max4CQ/view' -O video.mp4
          test $(stat -c%s video.mp4) -gt 1000000
          file video.mp4
      - name: Commit video to website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video.mp4
          git diff --cached --quiet || (git commit -m "Add video for inline playback" && git push)
